[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/cinewana-core",
  "crates/cinewana-database",
  "crates/cinewana-metadata",
  "crates/cinewana-scanner",
  "crates/cinewana-player"
]

[workspace.package]
version = "0.3.9"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.98"
chrono = { version = "0.4.41", features = ["serde"] }
parking_lot = "0.12.4"
regex = "1.11.1"
reqwest = { version = "0.12.22", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37.0", features = ["bundled", "chrono"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.16.0", features = ["v4", "serde"] }
walkdir = "2.5.0"
